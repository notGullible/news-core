services:
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    volumes:
      - redis-ngdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: fetcher
      POSTGRES_USER: fetcher
      POSTGRES_PASSWORD: fetcher
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fetcher -d fetcher"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-ngdata:
  pgdata:
