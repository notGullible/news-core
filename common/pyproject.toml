[project]
name = "common"
version = "0.1.0"
description = "Shared infrastructure for the NG pipeline (config, Redis, PostgreSQL, models, logging)"
requires-python = ">=3.14"
dependencies = [
    "redis>=7.4.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "python-dotenv>=1.0",
    "qdrant-client>=1.14",
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
